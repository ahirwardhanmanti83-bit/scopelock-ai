name: Deploy ScopeLock AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Instant IndexNow Ping to Bing & Yandex
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "ahirwardhanmanti83-bit.github.io",
              "key": "f4a7c88b6932468388de968be806bcfe",
              "keyLocation": "https://ahirwardhanmanti83-bit.github.io/scopelock-ai/f4a7c88b6932468388de968be806bcfe.txt",
              "urlList": [
                "https://ahirwardhanmanti83-bit.github.io/scopelock-ai/",
                "https://ahirwardhanmanti83-bit.github.io/scopelock-ai/upwork-scope-creep.html",
                "https://ahirwardhanmanti83-bit.github.io/scopelock-ai/fiverr-free-features.html",
                "https://ahirwardhanmanti83-bit.github.io/scopelock-ai/legal-change-order-template.html",
                "https://ahirwardhanmanti83-bit.github.io/scopelock-ai/client-refusing-to-pay-scope-creep.html",
                "https://ahirwardhanmanti83-bit.github.io/scopelock-ai/nextjs-fixed-price-project-scope-creep.html",
                "https://ahirwardhanmanti83-bit.github.io/scopelock-ai/mobile-app-feature-creep-contract-clause.html",
