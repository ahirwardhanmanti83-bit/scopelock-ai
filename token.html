<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Token Generator</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        h1 { color: #4CAF50; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #222; color: white; }
        button { background-color: #4CAF50; color: white; padding: 15px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; width: 95%; margin-top: 10px; }
        button:disabled { background-color: #555; }
        #status { margin-top: 20px; font-weight: bold; color: #ff9800; }
    </style>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js" type="application/javascript"></script>
</head>
<body>
    <h1>Create Your Token</h1>
    <p>Create your own ERC-20 Token on Sepolia Testnet</p>
    
    <input type="text" id="tokenName" placeholder="Token Name (e.g., MyToken)">
    <input type="text" id="tokenSymbol" placeholder="Token Symbol (e.g., MFT)">
    <input type="number" id="tokenSupply" placeholder="Total Supply (e.g., 1000000)">
    
    <button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
    <button id="deployBtn" onclick="deployToken()" disabled>Deploy Token</button>
    
    <div id="status"></div>

    <script>
        let provider;
        let signer;

        // Standard ERC20 ABI for deployment
        const abi = [
            "constructor(string memory name_, string memory symbol_, uint256 totalSupply_)"
        ];
        
        // Pre-compiled ERC20 Bytecode (to make it fast on mobile)
        const bytecode = "0x608060405234801561001057600080fd5b50604051610a0c380380610a0c8339818101604052606081101561003457600080fd5b81019080805190602001909291908051906020019092919080519060200190929190505050826000806101000a81548173ffffffffffffffffffffffffffffffffffffffff021916908373ffffffffffffffffffffffffffffffffffffffff16021790555081600190805190602001906100ad929190610124565b5080600281905550505050610179565b828054610130906101b7565b90600052602060002090601f0160209004810192821561016c576001600160a01b0383168115610155578260010180546001816001161561010002031660029004905561016c565b60008481526020812060001990920191909101905b50505050565b61021c806101886000396000f3fe6080604052600436106100295760003560e01c806306fdde031461002e57806318160ddd146100be57610034565b600080fd5b34801561003a57600080fd5b506100436100e9565b6040518080602001828103825283818151815260200191508051906020019080838360005b83811015610083578082015181840152808401935050610068565b50505050905090810190601f1680156100b05780820380516001836020036101000a031916815260200191505b509250505060405180910390f35b3480156100ca57600080fd5b506100d3610187565b6040518082815260200191505060405180910390f35b60008054600181600116156101000203166002900480601f01602080910402602001604051908101604052809291908181526020018280546001816001161561010002031660029004801561017f5780601f106101545761010080835404028352916020019161017f565b820191906000526020600020905b81548152906001019060200180831161016257829003601f168201915b505050505081565b6000548156fea2646970667358221220a43f28e6b6b9d4c0d5f031e655370021553d0a284c5b0b2e5e5e5e5e5e5e5e5e564736f6c63430008000033";

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    document.getElementById('status').innerText = "Wallet Connected!";
                    document.getElementById('deployBtn').disabled = false;
                    document.getElementById('connectBtn').disabled = true;
                } catch (error) {
                    document.getElementById('status').innerText = "Connection failed.";
                }
            } else {
                document.getElementById('status').innerText = "Please install MetaMask!";
            }
        }

        async function deployToken() {
            const name = document.getElementById('tokenName').value;
            const symbol = document.getElementById('tokenSymbol').value;
            const supply = document.getElementById('tokenSupply').value;

            if (!name || !symbol || !supply) {
                alert("Please fill all fields!");
                return;
            }

            document.getElementById('status').innerText = "Deploying token... Please wait.";
            
            try {
                const factory = new ethers.ContractFactory(abi, bytecode, signer);
                // Convert supply to BigNumber
                const supplyWei = ethers.utils.parseUnits(supply, 18);
                
                const contract = await factory.deploy(name, symbol, supplyWei);
                document.getElementById('status').innerText = "Waiting for confirmation...";
                await contract.deployed();
                
                document.getElementById('status').innerText = "Success! Token deployed at: " + contract.address;
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "Deployment failed. Check console.";
            }
        }
    </script>
</body>
</html>
