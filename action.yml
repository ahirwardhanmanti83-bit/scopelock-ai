name: 'ScopeLock AI - Autonomous Scope Creep Auditor'
description: 'Automated CI/CD Scope Creep Auditor & Statutory UCC § 2-209 Legal Change Order Engine for Dev Studios & Agencies.'
author: 'Krishna Ahirwar'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  hourly_rate:
    description: 'Agency standard billing hourly rate in USD ($/hr) for variance calculations'
    required: false
    default: '125'
  baseline_ref:
    description: 'Git baseline commit or branch ref to compare against (defaults to HEAD~1)'
    required: false
    default: 'HEAD~1'
  fail_on_creep:
    description: 'Whether to fail the CI workflow if unbilled scope creep exceeds threshold'
    required: false
    default: 'false'

outputs:
  creep_detected:
    description: 'Boolean string ("true" or "false") indicating if unbilled features were detected'
  estimated_hours:
    description: 'Estimated unbilled developer hours leaked'
  dollar_leakage:
    description: 'Total calculated monetary variance in USD'
  change_order_url:
    description: 'Direct statutory UCC § 2-209 change order generator URL'

runs:
  using: 'node20'
  main: 'action/index.js'
